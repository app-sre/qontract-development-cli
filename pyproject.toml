[project]
name = "qontract-development-cli"
version = "0.19.1"
description = "Helper tool for qontract-reconcile development"
authors = [{ name = "Christian Assing", email = "cassing@redhat.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">= 3.14"
dependencies = [
    "appdirs ~=1.4.4",
    "getkey ~=0.6.5",
    "jinja2 ~=3.1",
    "pydantic ~=2.9",
    "pydantic-settings ~=2.6",
    "pyyaml ~=6.0.2",
    "rich ~=15.0",
    "typer ~=0.27.0",
    "watchfiles ~=1.2.0",
]

[dependency-groups]
dev = [
    # dev dependencies
    "mypy ~=2.0",
    "pytest ~=9.1",
    "ruff ~=0.7",
    "types-pyyaml ~=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
homepage = "http://github.com/chassing/qontract-development-cli"
repository = "http://github.com/chassing/qontract-development-cli"
documentation = "http://github.com/chassing/qontract-development-cli"

[project.scripts]
qd = "qontract_development_cli.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["qontract_development_cli"]

[tool.hatch.build.targets.wheel]
only-include = ["qontract_development_cli"]

[tool.mypy]
files = ["qontract_development_cli"]
plugins = "pydantic.mypy"
enable_error_code = "truthy-bool, redundant-expr"
no_implicit_optional = true
check_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["getkey.*", "appdirs.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
src = ["qontract_development_cli"]
extend-exclude = [".local", ".cache"]
fix = true

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "any-type",                             # Disallow *args, **kwargs with ANY
    "unused-class-method-argument",         # Unusable arguments
    "CPY",                                  # Missing copyright header
    "D10",                                  # docstrings
    "incorrect-blank-line-before-class",    # 1 blank line required before class docstring
    "blank-line-before-class",              # No blank lines allowed before class docstring
    "multi-line-summary-first-line",        # multi-line-summary-first-line
    "multi-line-summary-second-line",       # multi-line-summary-second-line
    "D4",                                   # Doc string style
    "line-too-long",                        # Line too long
    "logging-f-string",                     # Logging statement uses string formatting
    "assert",                               # Use of assert detected. Pytest uses assert
    "raw-string-in-exception",
    "f-string-in-exception",
    "suspicious-subprocess-import",         # subprocess possibly insecure
    "subprocess-without-shell-equals-true", # subprocess check user input
    "start-process-with-partial-path",      # subprocess partical executable path
    "relative-imports",                     # relative imports
    "raise-vanilla-args",
    # pydoclint
    "DOC",
    # May conflict with the formatter, https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "tab-indentation",
    "indentation-with-invalid-multiple",
    "indentation-with-invalid-multiple-comment",
    "over-indented",
    "docstring-tab-indentation",
    "triple-single-quotes",
    "Q",
    "missing-trailing-comma",
    "prohibited-trailing-comma",
    "single-line-implicit-string-concatenation",
]

[tool.ruff.format]
preview = true

[tool.ruff.lint.isort]
known-first-party = ["qontract_development_cli"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]
runtime-evaluated-decorators = [
    "dataclasses.dataclass",
    "pydantic.dataclasses.dataclass",
    "pydantic.validate_call",
    "typer.Typer.command",
    "typer.Typer.callback",
]
